<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Almoxarifado IoT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Controle de Almoxarifado</h1>

    <!-- PRODUTO -->

    <div class="card">

        <h2>Cadastro de Produto</h2>

        <form>

            <label>Nome</label>
            <input type="text">

            <label>Descrição</label>
            <input type="text">

            <label>Categoria</label>
            <input type="text">

            <label>Código de Barras</label>
            <input type="text">

            <label>Preço</label>
            <input type="number">

            <label>Unidade</label>
            <input type="text">

            <label>Status</label>

            <select>

                <option>ATIVO</option>
                <option>EM_FALTA</option>
                <option>INATIVO</option>
                <option>DANIFICADO</option>

            </select>

            <button>Cadastrar Produto</button>

        </form>

    </div>

    <!-- TAG -->

    <div class="card">

        <h2>Cadastro da Tag RFID</h2>

        <form>

            <label>Código da Tag</label>
            <input type="text">

            <label>Produto</label>

            <select>

                <option>Notebook Dell</option>
                <option>Mouse Logitech</option>

            </select>

            <button>Vincular Tag</button>

        </form>

    </div>

    <!-- LEITOR -->

    <div class="card">

        <h2>Cadastro do Leitor RFID</h2>

        <form>

            <label>Nome</label>
            <input type="text">

            <label>Endereço IP</label>
            <input type="text">

            <label>Localização</label>
            <input type="text">

            <button>Cadastrar Leitor</button>

        </form>

    </div>

</div>

</body>
</html>
