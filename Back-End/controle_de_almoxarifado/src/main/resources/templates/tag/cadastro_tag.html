<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">

    <title>Cadastro de Tag RFID</title>

    <style>

        body{

            font-family:Arial;
            background:#f4f4f4;
            padding:40px;

        }

        .container{

            width:600px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:10px;

        }

        input,select{

            width:100%;
            padding:10px;
            margin-top:10px;

        }

        button{

            margin-top:20px;
            width:100%;
            padding:12px;
            background:green;
            color:white;
            border:none;

        }

    </style>

</head>
<body>

<div class="container">

    <h2>Cadastro de Tag RFID</h2>

    <form th:action="@{/tag/salvar}"
          th:object="${tagRFID}"
          method="post">

        <label>Código da Tag</label>

        <input type="text"
               th:field="*{codigoTag}">

        <label>Produto</label>

        <select th:field="*{produto}">

            <option
                    th:each="produto : ${produtos}"
                    th:value="${produto.id}"
                    th:text="${produto.nome}">
            </option>

        </select>

        <label>Tag Ativa?</label>

        <select th:field="*{ativo}">

            <option value="true">Sim</option>

            <option value="false">Não</option>

        </select>

        <button>

            Salvar

        </button>

    </form>

</div>

</body>
</html>
