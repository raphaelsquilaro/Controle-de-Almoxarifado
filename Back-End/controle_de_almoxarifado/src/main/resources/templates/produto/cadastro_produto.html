<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            margin:0;
            padding:40px;
        }

        .container{
            width:600px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#333;
        }

        label{
            display:block;
            margin-top:15px;
            font-weight:bold;
        }

        input, textarea, select{

            width:100%;
            padding:10px;
            margin-top:5px;
            border:1px solid #ccc;
            border-radius:5px;

        }

        button{

            width:100%;
            margin-top:25px;
            padding:12px;
            background:#1565C0;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;

        }

        button:hover{

            background:#0D47A1;

        }

    </style>

</head>
<body>

<div class="container">

    <h2>Cadastro de Produto</h2>

    <form th:action="@{/produto/salvar}" th:object="${produto}" method="post">

        <label>Nome</label>
        <input type="text" th:field="*{nome}">

        <label>Descrição</label>
        <textarea th:field="*{descricao}"></textarea>

        <label>Categoria</label>
        <input type="text" th:field="*{categoria}">

        <label>Status</label>

        <select th:field="*{status}">
            <option value="">Selecione</option>
            <option th:each="status : ${statusProduto}"
                    th:value="${status}"
                    th:text="${status}">
            </option>
        </select>

        <button type="submit">
            Salvar Produto
        </button>

    </form>

</div>

</body>
</html>
